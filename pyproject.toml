[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rys-jev"
version = "0.1.0"
description = "Layer-duplicated StartLux-Decision Instant models: engine, server and materializer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "David Ng"}]
dependencies = [
  "torch>=2.6",
  "transformers>=5.17",
  "safetensors>=0.4",
  "aiohttp>=3.9",
  "numpy",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rys-jev = "rys_jev.cli:main"

[tool.setuptools.packages.find]
include = ["rys_jev*"]
